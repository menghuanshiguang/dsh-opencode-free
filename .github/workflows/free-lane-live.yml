name: free-lane-live

# The only entry point that spends the upstream free quota.
# The trigger surface is deliberately a single key: nothing else may reach this
# workflow (gate 0.1, and 验收员's adversarial check E1/E2).
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'One free model id (no commas, no spaces)'
        required: true
        default: nemotron-3.5-lightning-free
        type: string
      confirm:
        description: 'Type true to send exactly one live request'
        required: true
        default: 'false'
        type: string
      dry_run:
        description: 'true = stop before the request and rehearse the reporting path (spends nothing)'
        required: false
        default: 'false'
        type: string

permissions:
  contents: read
  actions: read

# Queues, never cancels: the second dispatch has to be refused by the preflight
# step, not silently run later (constraint 3).
concurrency:
  group: free-lane-live
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Ebony-Vinyl/dsh-our-free-model
  UPSTREAM_SHA: f29116baea55483ff067c1816966f1d08d8f0981
  # 产物名只在这一行定义：步骤名、上传清单、归档脚本都读它，别处不再写字面量。
  GATES_PRODUCT: gates.flat.json

jobs:
  live:
    name: live (${{ inputs.model }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: preflight — inputs
        run: |
          set -euo pipefail
          model='${{ inputs.model }}'
          confirm='${{ inputs.confirm }}'
          echo "model=$model"
          echo "confirm=$confirm"
          [ "$confirm" = 'true' ] || { echo "::error::confirm must be exactly true"; exit 1; }
          echo "GATES_CONFIRM=$confirm" >> "$GITHUB_ENV"
          case "$model" in
            *[[:space:],]*) echo "::error::exactly one model per run"; exit 1 ;;
          esac
          printf '%s' "$model" | grep -Eq '^[a-z0-9][a-z0-9.-]*-free$' || { echo "::error::model is not a free-lane id"; exit 1; }

      - name: preflight — refuse a second live run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/free-lane-live.yml/runs?per_page=100"
          curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$api" > "$RUNNER_TEMP/runs.json"
          jq -r '.workflow_runs[] | "\(.id) \(.status) \(.conclusion // "-") \(.created_at)"' "$RUNNER_TEMP/runs.json" | head -20
          busy=$(jq --arg id "$GITHUB_RUN_ID" '[.workflow_runs[] | select((.id|tostring) != $id) | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length' "$RUNNER_TEMP/runs.json")
          # A queued second dispatch only starts after the first finishes, so the
          # busy check alone cannot see it. A cooldown on completed runs is what
          # actually refuses it (and it also protects the upstream quota window).
          # A run that stopped before the live step spent nothing (the baseline
          # publish is exactly that), so it must not start the cooldown.
          recent=0
          for rid in $(jq -r --arg id "$GITHUB_RUN_ID" --argjson now "$(date -u +%s)" '.workflow_runs[] | select((.id|tostring) != $id) | select(.status == "completed") | select((.updated_at|fromdateiso8601) > ($now - 900)) | .id' "$RUNNER_TEMP/runs.json"); do
            live_step=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$rid/jobs" \
              | jq -r '[.jobs[].steps[] | select(.name | startswith("live request"))] | .[0].conclusion // "missing"')
            echo "  recent run $rid live-step=$live_step"
            if [ "$live_step" != "skipped" ] && [ "$live_step" != "missing" ]; then recent=$((recent + 1)); fi
          done
          echo "preflight: other_busy=$busy recent_spent=$recent (cooldown 900s)"
          if [ "$busy" -gt 0 ]; then
            echo "::error::refused — another live run is already queued or running"
            exit 1
          fi
          if [ "$recent" -gt 0 ] && [ '${{ inputs.dry_run }}' != 'true' ]; then
            echo "::error::refused — a live run completed less than 15 minutes ago (single-shot discipline)"
            exit 1
          fi
          [ '${{ inputs.dry_run }}' = 'true' ] && echo "preflight: dry run — cooldown not applied (no request will be sent)" || true
          echo "preflight: no other live run in flight"

      - name: egress (recorded before any request)
        run: |
          set -euo pipefail
          trace=$(curl -sS --max-time 15 'https://www.cloudflare.com/cdn-cgi/trace' || true)
          ip=$(printf '%s\n' "$trace" | sed -n 's/^ip=//p')
          country=$(printf '%s\n' "$trace" | sed -n 's/^loc=//p')
          colo=$(printf '%s\n' "$trace" | sed -n 's/^colo=//p')
          echo "egressIp=$ip"
          echo "country=$country"
          echo "colo=$colo"
          printf 'egressIp=%s\ncountry=%s\ncolo=%s\n' "$ip" "$country" "$colo" > "$RUNNER_TEMP/egress.env"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # P3 判的是整个历史里有没有真 token：默认的 fetch-depth 1 只送来一个提交，
          # `git log -p --all` 就只看得见它，那样 P3 等于拿浅历史充数——比跳过更坏。
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2

      - name: transport must be the production Bun worker
        run: |
          set -euo pipefail
          bun --version | tee bun-version.txt
          echo "GATES_BUN_VERSION=$(bun --version)" >> "$GITHUB_ENV"
          echo "OUR_FREE_MODEL_BUN=$(command -v bun)" >> "$GITHUB_ENV"
          test -z "${OUR_FREE_MODEL_FREE_TRANSPORT:-}" || { echo "::error::OUR_FREE_MODEL_FREE_TRANSPORT must stay unset"; exit 1; }
          test -x "$(command -v bun)"

      # The dump and the request have to be rendered in the SAME working directory:
      # the system prompt carries `process.cwd()` in its environment block, so a
      # dump taken inside `upstream/` describes a body the gateway (running from the
      # repository root) never sends. 督查's ruling: align the cwds — a mismatch must
      # keep failing step 13, not be normalised away.
      - name: 'fingerprint fields (same cwd as the live call, the repository root)'
        env:
          OFM_UPSTREAM_DIR: ${{ github.workspace }}/upstream
        run: |
          set -euo pipefail
          node tools/fingerprint-fields.mjs "${{ inputs.model }}" "$RUNNER_TEMP/fields.json"

      - name: fingerprint baseline must match the committed lock
        env:
          OFM_UPSTREAM_DIR: ${{ github.workspace }}/upstream
        run: |
          set -uo pipefail
          node tools/fingerprint-baseline.mjs "${{ inputs.model }}" --assert
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "::error::no docs/fingerprint-baseline.json — this run publishes the baseline and stops BEFORE spending quota; commit it, then dispatch again"
            node tools/fingerprint-baseline.mjs "${{ inputs.model }}" > "$RUNNER_TEMP/baseline.json"
            exit 1
          fi
          exit "$status"

      - name: live request (one model, one request, no retry)
        id: live
        if: inputs.dry_run != 'true' 
        env:
          OFM_WIRE_DIR: ${{ runner.temp }}/wire
        run: |
          set -euo pipefail
          # The shipped path, not a side door: the package's own gateway starts on
          # loopback and this drives it like a client. Two preloads observe the
          # same turn — the wire tap records the serialised body, and the transport
          # observer records the Bun worker's pid — so gates 0.3 and 0.7 read
          # observations instead of inferring from what the runner installed.
          test -x "$(command -v bun)"
          node --import "$GITHUB_WORKSPACE/tools/capture-wire.mjs" \
               --import "$GITHUB_WORKSPACE/tools/observe-transport.mjs" \
               scripts/live-test.mjs --live --model "${{ inputs.model }}" \
            | tee "$RUNNER_TEMP/live.json"

      - name: report the wire capture
        if: always() && steps.live.outcome != 'skipped' 
        run: |
          set -uo pipefail
          node tools/report-wire.mjs --dir "$RUNNER_TEMP/wire" --expect "$RUNNER_TEMP/fields.json" | tee "$RUNNER_TEMP/wire-report.txt"

      - name: the per-run gates product (flat; the archive re-projects it later)
        id: gates
        if: always() && steps.live.outcome != 'skipped' 
        run: |
          set -uo pipefail
          node tools/gates.mjs \
            --fields "$RUNNER_TEMP/fields.json" \
            --live "$RUNNER_TEMP/live.json" \
            --egress "$RUNNER_TEMP/egress.env" \
            --wire "$RUNNER_TEMP/wire" \
            --out "$RUNNER_TEMP/$GATES_PRODUCT" | tee "$RUNNER_TEMP/gates.txt"

      - name: rehearsal — the reporting path runs and fails only where designed
        if: inputs.dry_run == 'true'
        env:
          OFM_WIRE_DIR: ${{ runner.temp }}/wire
        run: |
          # The runner shell is `bash -e`, so a deliberately failing reporter would
          # abort the step before its exit code is inspected. The rehearsal reads
          # those codes itself and decides; it never lets them end the step.
          set -uo pipefail
          set +e
          echo "dry run: no live request is sent; the reporters run against an empty capture"
          node tools/report-wire.mjs --dir "$RUNNER_TEMP/wire" --expect "$RUNNER_TEMP/fields.json" > "$RUNNER_TEMP/rehearsal-report.txt" 2>&1
          rc_report=$?
          cat "$RUNNER_TEMP/rehearsal-report.txt"
          test "$rc_report" -eq 1 || { echo "::error::report-wire should refuse an empty capture with exit 1, got $rc_report"; exit 1; }
          grep -q 'no wire capture' "$RUNNER_TEMP/rehearsal-report.txt" || { echo "::error::report-wire did not name the missing capture"; exit 1; }

          # The rehearsal product is written in the archive's shape (the same
          # projection the artifact will carry), and judged by parsing it: the
          # failing set must be exactly 0.3, 0.5, 0.6, 0.7, 0.9 — not "0.3 failed
          # and postCount is 0" with the rest unexamined, and never by grepping
          # the document for text.
          node tools/gates.mjs --fields "$RUNNER_TEMP/fields.json" --live "$RUNNER_TEMP/live.json" \
            --egress "$RUNNER_TEMP/egress.env" --wire "$RUNNER_TEMP/wire" \
            --out "$RUNNER_TEMP/$GATES_PRODUCT" > "$RUNNER_TEMP/rehearsal-gates.txt" 2>&1
          rc_gates=$?
          cat "$RUNNER_TEMP/rehearsal-gates.txt"
          test "$rc_gates" -eq 1 || { echo "::error::gates must fail a zero-request run with exit 1, got $rc_gates"; exit 1; }
          node gates/check-rehearsal.mjs "$RUNNER_TEMP/$GATES_PRODUCT" --shape flat | tee "$RUNNER_TEMP/rehearsal-check.txt"
          exit 0

      # The upload has to come BEFORE the archive: from-artifact's `artifacts` section lists
      # what this run uploaded — name, digest and retention all come from the API, and before
      # the upload that list is empty, so the archive would either fail or record nothing.
      - name: the flat product exists before it is uploaded
        if: always()
        run: |
          set -uo pipefail
          product="$RUNNER_TEMP/$GATES_PRODUCT"
          if [ ! -f "$product" ]; then
            echo "::error::no $GATES_PRODUCT at $product — the gates step produced nothing, and the upload would ship an artifact without it"
            exit 1
          fi
          node -e '
          const d = JSON.parse(require("node:fs").readFileSync(process.argv.at(-1), "utf8"))
          const need = ["run", "postCount", "retried", "toolsSha256", "checks"]
          const missing = need.filter(k => d[k] === undefined)
          if (missing.length) { console.error(`not the product shape, missing ${missing.join(",")}`); process.exit(1) }
          console.log(`flat product: run=${d.run.id} postCount=${d.postCount} checks=${Object.keys(d.checks).length}`)
          ' "$product"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/${{ env.GATES_PRODUCT }}
            ${{ runner.temp }}/live.json
            ${{ runner.temp }}/fields.json
            ${{ runner.temp }}/baseline.json
            ${{ runner.temp }}/wire-report.txt
            ${{ runner.temp }}/gates.txt
            ${{ runner.temp }}/rehearsal-*.txt
            ${{ runner.temp }}/egress.env
            ${{ runner.temp }}/wire/**
            bun-version.txt
          retention-days: 30

      # 归档序列只有一处定义：scripts/archive-live-run.sh。三个前置门的输入由脚本自己取
      # （git show HEAD:LICENSE、git log -p --all、--repo-json 指的那份），这里只给它
      # 本次 run 的 API JSON 与产物目录。CI 用合成输入调同一个脚本，并证明它会红。
      - name: archive this run (one script, stage 4)
        if: always() && steps.live.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json')
          curl -sS "${auth[@]}" "$api/actions/runs/$GITHUB_RUN_ID" -o "$RUNNER_TEMP/run.json"
          curl -sS "${auth[@]}" "$api/actions/runs/$GITHUB_RUN_ID/jobs" -o "$RUNNER_TEMP/jobs.json"
          curl -sS "${auth[@]}" "$api/actions/runs/$GITHUB_RUN_ID/artifacts" -o "$RUNNER_TEMP/artifacts.json"
          curl -sS "${auth[@]}" "$api" -o "$RUNNER_TEMP/repo.json"
          bash scripts/archive-live-run.sh \
            --dir "$RUNNER_TEMP" \
            --out "$RUNNER_TEMP/archive/gates.json" \
            --run-json "$RUNNER_TEMP/run.json" \
            --jobs-json "$RUNNER_TEMP/jobs.json" \
            --artifacts-json "$RUNNER_TEMP/artifacts.json" \
            --repo-json "$RUNNER_TEMP/repo.json" \
            --product "$GATES_PRODUCT" | tee archive.txt

      - uses: actions/upload-artifact@v4
        if: always() && steps.live.outcome == 'success'
        with:
          name: archive-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/archive/gates.json
            ${{ runner.temp }}/archive/preconditions.json
            ${{ runner.temp }}/archive/negative-tests.json
            archive.txt
