name: free-lane-ci

# Offline only. This workflow must never spend the free lane's quota, so it runs
# with a network guard that refuses every off-loopback request made by a test
# process. The asset refresh is the one exception, and it talks to
# raw.githubusercontent.com — never to the inference host.
on:
  push:
    branches: ['**']
    # Stage 5 ships a tag and wants CI green on it. Without this trigger a tag
    # push starts nothing, so "green on the tag" would be unobservable.
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: free-lane-ci-${{ github.ref }}
  # A superseded branch run is noise; a superseded tag run is a missing receipt.
  # Tag refs always run to completion, so the release tag's result exists.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  UPSTREAM_REPO: Ebony-Vinyl/dsh-our-free-model
  UPSTREAM_SHA: f29116baea55483ff067c1816966f1d08d8f0981
  FREE_MODEL: nemotron-3.5-lightning-free

jobs:
  tool-contracts:
    name: tool-contracts (byte-for-byte fingerprint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The baseline-import check reads the trees at c18b290, so this job
          # needs the history rather than a single-commit clone.
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: assert the upstream checkout is the pinned commit
        run: |
          set -euo pipefail
          head=$(git -C upstream rev-parse HEAD)
          echo "upstream HEAD: $head"
          test "$head" = "$UPSTREAM_SHA"

      - name: baseline import (set equality, read from the git trees)
        run: |
          set -euo pipefail
          node acceptance/verify-baseline-import.mjs --repo . --upstream upstream --baseline c18b290 | tee verify-baseline-import.txt

      - name: contract check (13 tool contracts + system prompt)
        run: |
          set -euo pipefail
          node tools/contract-check.mjs "$FREE_MODEL" | tee contract-check.txt

      - name: validator fixture (a check nobody has seen fail is decoration)
        run: |
          set -euo pipefail
          node tools/gates-selftest.mjs | tee gates-selftest.txt
          node gates/selftest.mjs | tee gates-archive-selftest.txt
          # stage 0 缺 --lock 现在 exit 2（闸门缺参不许降级）。夹具这一跑同样必须带锁，
          # 否则被自己的规矩判死——这不是放宽 exit 2 的理由，是夹具该带参数。
          node gates/validate.mjs gates/fixtures/stage0.synthetic.json --stage 0 --allow-synthetic --lock docs/fingerprint-baseline.json | tee gates-validate.txt
          # The archived records must stay valid against the lock, not only the fixture.
          for f in gates/stage0/*.json; do
            [ "$(basename "$f")" = index.json ] && continue
            node gates/validate.mjs "$f" --stage 0 --lock docs/fingerprint-baseline.json | tee -a gates-archive-validate.txt
          done

      - name: fingerprint baseline (normalised; lock if committed)
        run: |
          set -uo pipefail
          node tools/fingerprint-baseline.mjs "$FREE_MODEL" > baseline.json
          cat baseline.json
          set +e
          node tools/fingerprint-baseline.mjs "$FREE_MODEL" --assert
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::no docs/fingerprint-baseline.json yet — this run publishes the baseline, it is not evidence"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: upstream offline suites (network guard on)
        run: |
          set -euo pipefail
          cd upstream
          for suite in fingerprint-test opencode-parity-test free-lane-wire-test free-lane-compat-test free-lane-quota-test; do
            # "=== " is also what the suites print for their own headings, so the
            # marker the counter looks for has to be its own.
            echo "### suite: $suite"
            # The guard states its verdict on stderr, so the artifact has to hold
            # both streams: a count taken from stdout alone would find no guard
            # lines and could not tell "zero requests" from "no guard at all".
            node --import "$GITHUB_WORKSPACE/tools/guard-offline.mjs" "scripts/$suite.mjs" 2>&1
          done | tee "$GITHUB_WORKSPACE/suites.txt"

      - name: count the off-loopback attempts (zero, and show the detector was on)
        run: |
          set -uo pipefail
          suites=$(grep -c '^### suite: ' suites.txt || true)
          guards=$(grep -c '^\[guard-offline\] no off-loopback request was attempted' suites.txt || true)
          blocked=$(grep -c '^\[guard-offline\] BLOCKED' suites.txt || true)
          {
            echo "suites run:                    $suites"
            echo "guard reported clean:          $guards"
            echo "off-loopback attempts blocked: $blocked"
            echo "OFFLINE REQUESTS: $blocked"
          } | tee offline-requests.txt
          # A zero means nothing unless the detector was running: every suite must
          # have loaded the guard and reported its own clean exit line.
          if [ "$blocked" -ne 0 ]; then
            echo "::error::a suite tried to leave loopback — the guard stopped it, fix the suite"
            exit 1
          fi
          if [ "$suites" -eq 0 ] || [ "$guards" -ne "$suites" ]; then
            echo "::error::guard clean lines ($guards) != suites ($suites) — the guard did not run for every suite, so this zero is not evidence"
            exit 1
          fi
          echo "OFFLINE REQUESTS: 0 observed, guard armed on $guards/$suites suites"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tool-contracts
          path: |
            contract-check.txt
            gates-selftest.txt
            gates-archive-selftest.txt
            gates-validate.txt
            gates-archive-validate.txt
            baseline.json
            suites.txt
            offline-requests.txt
            verify-baseline-import.txt
          retention-days: 30

  assets:
    name: assets (anonymous source + rebuild)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The pinned fetcher reads through `gh api`, which needs a token. This repo
      # carries none, so `gh` on PATH is an anonymous shim that reads
      # raw.githubusercontent.com and computes the git blob SHA itself.
      - name: install the anonymous gh shim
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cp tools/gh-anon-shim.mjs "$RUNNER_TEMP/bin/gh"
          chmod +x "$RUNNER_TEMP/bin/gh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Two facts decide how this is asserted. GitHub runs a `run:` step with the
      # default shell as `bash --noprofile --norc -eo pipefail {0}` — a NON-login
      # shell, which is also what the fetch step gets. And `$GITHUB_PATH` only takes
      # effect for steps that start after the one that wrote it. So the assertion
      # lives in its own step, in the same shell kind the fetch will use; asking a
      # login shell (`bash -lc`) would re-source /etc/profile, put /usr/bin back in
      # front, and measure an environment no step ever runs in.
      - name: the shim is what `gh` resolves to (same shell as the fetch)
        run: |
          set -euo pipefail
          resolved=$(command -v gh)
          echo "gh resolves to $resolved"
          test "$resolved" = "$RUNNER_TEMP/bin/gh" || { echo "::error::gh resolves to $resolved, not the anonymous shim at $RUNNER_TEMP/bin/gh"; exit 1; }

      - name: fetch the pinned sources anonymously
        run: |
          set -euo pipefail
          export OFM_ASSET_LOG="$RUNNER_TEMP/asset-log.jsonl"
          cd upstream
          node scripts/fetch-opencode-assets.mjs --force

      - name: the fetch was anonymous (URLs from the log, headers from the shim)
        env:
          OFM_ASSET_LOG: ${{ runner.temp }}/asset-log.jsonl
        run: |
          set -euo pipefail
          test -s "$OFM_ASSET_LOG" || { echo "::error::no asset log at $OFM_ASSET_LOG — anonymity cannot be shown"; exit 1; }
          node -e '
            const { readFileSync } = require("node:fs")
            const lines = readFileSync(process.env.OFM_ASSET_LOG, "utf8").split("\n").filter(Boolean)
            const entries = lines.map(line => { try { return JSON.parse(line) } catch { return null } })
            if (entries.includes(null)) { console.error("::error::asset log has a line that is not JSON"); process.exit(1) }
            if (entries.length === 0) { console.error("::error::asset log is empty"); process.exit(1) }
            const badURL = entries.filter(entry => !/^https:\/\/raw\.githubusercontent\.com\//.test(String(entry.url ?? "")))
            const notOK = entries.filter(entry => entry.ok !== true)
            const withAuth = entries.filter(entry => /authorization/i.test(JSON.stringify(entry)))
            if (badURL.length) { console.error(`::error::${badURL.length} fetch(es) were not from raw.githubusercontent.com: ${badURL.slice(0, 3).map(e => e.url).join(", ")}`); process.exit(1) }
            if (notOK.length) { console.error(`::error::${notOK.length} fetch(es) did not succeed`); process.exit(1) }
            if (withAuth.length) { console.error(`::error::${withAuth.length} log record(s) carry an Authorization marker`); process.exit(1) }
            console.log(`anonymous fetch proven: ${entries.length} request(s), all raw.githubusercontent.com, no authorization marker in any record`)
          '
          # The headers live in the shim, not in its log, so the header claim is
          # asserted where it is written: the shim must send no credential header.
          if grep -qi 'authorization' tools/gh-anon-shim.mjs; then
            echo "::error::the anonymous shim mentions an Authorization header"
            exit 1
          fi
          echo "shim source carries no authorization header"

      - name: documented blob SHAs must match
        env:
          OFM_ASSET_LOG: ${{ runner.temp }}/asset-log.jsonl
        run: |
          set -euo pipefail
          node tools/asset-lock.mjs --write "$RUNNER_TEMP/opencode-assets.lock.json" | tee asset-lock.txt

      - name: rebuild the assets and require a clean tree
        run: |
          set -euo pipefail
          cd upstream
          node scripts/build-o2a-assets.mjs
          git diff --stat
          git diff --exit-code -- src/o2a/assets
          # The anonymity half is asserted by the step above, from the shim's own
          # log; this echo names only what this step proves.
          echo "assets rebuilt byte-identically (source anonymity asserted in the fetch step)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assets
          path: |
            asset-lock.txt
            ${{ runner.temp }}/opencode-assets.lock.json
            ${{ runner.temp }}/asset-log.jsonl
          retention-days: 30

  extraction:
    name: extraction (two kept groups, and the verifier's checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The new-line policy compares the import commit against this one, so
          # the shallow single-commit clone would leave the base unreachable.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: install the dev dependencies the typecheck needs
        run: npm install --no-audit --no-fund

      - name: check-extraction (import set, excluded reach, exports, leftovers)
        run: node scripts/check-extraction.mjs | tee extraction.txt

      - name: new-line policy (a carried-over file may not gain a line undeclared)
        run: node gates/check-newline-policy.mjs | tee newline-policy.txt

      - name: npm test
        run: npm test

      - name: npm run typecheck
        run: npm run typecheck

      - name: the archive sequence is one script, and it fails where it should
        run: |
          set -euo pipefail
          node gates/check-archive-script.mjs | tee archive-script.txt

      - name: rehearsal assertions bite (postCount is a number, gates are parsed)
        run: |
          set -euo pipefail
          node gates/check-rehearsal.mjs --self-test | tee rehearsal.txt

      - name: a live product must archive (fixture; schema untouched)
        run: |
          set -euo pipefail
          node gates/check-live-artifact.mjs | tee live-artifact.txt

      - name: gateway contract (the verifier's bench, under the guard)
        run: |
          set -uo pipefail
          G="$GITHUB_WORKSPACE/tools/guard-offline.mjs"
          NODE_OPTIONS="--import $G" node acceptance/gateway-contract.mjs 2>&1 | tee gateway-contract.txt
          bench=${PIPESTATUS[0]}
          # The bench counts its own attempts and reports "0 outside loopback".
          # That zero is only worth something if the guard was in the process, so
          # the guard's own line has to be in the same artifact; without it the
          # run fails even when the bench says PASS.
          if ! grep -q '^\[guard-offline\] no off-loopback request was attempted' gateway-contract.txt; then
            echo "::error::the guard never reported from the bench process — a PASS without it does not show the bench stayed offline"
            exit 1
          fi
          echo "OFFLINE REQUESTS: $(grep -c '^\[guard-offline\] BLOCKED' gateway-contract.txt || true) blocked; guard armed"
          exit "$bench"

      - name: contract tests, with every off-loopback request refused
        # The guard is a preload that throws on any off-loopback fetch and on any
        # attempt to start the Bun worker. NODE_OPTIONS carries it into the child
        # process the test runner spawns per file, so the assertion is about the
        # bytes a test would actually send, not about the parent process.
        run: |
          set -euo pipefail
          G="$GITHUB_WORKSPACE/tools/guard-offline.mjs"
          NODE_OPTIONS="--import $G" node --test scripts/tests/*.test.mjs 2>&1 | tee contract-guard.txt
          grep -q 'no off-loopback request was attempted' contract-guard.txt
          if grep -q 'BLOCKED fetch' contract-guard.txt; then echo "::error::a test tried to reach the network"; exit 1; fi

      - name: the live script sends nothing without --live
        run: |
          set -euo pipefail
          G="$GITHUB_WORKSPACE/tools/guard-offline.mjs"
          NODE_OPTIONS="--import $G" node scripts/live-test.mjs 2>&1 | tee live-skip.txt
          grep -q '^Skipped: pass --live to send an actual request\.$' live-skip.txt
          grep -q 'no off-loopback request was attempted' live-skip.txt

      - name: zero /inference requests during CI (counted, not claimed)
        run: |
          set -euo pipefail
          count=$(cat contract-guard.txt live-skip.txt | grep -c 'BLOCKED fetch' || true)
          echo "off-loopback fetch attempts during CI: $count" | tee off-loopback.txt
          test "$count" -eq 0

      - name: acceptance — year clock, today
        run: node acceptance/year-clock-test.mjs | tee year-clock-today.txt

      - name: acceptance — year clock, injected 2027-01-01
        # rc may be 0 (still consistent) or 1 (the asset's frozen year, a known
        # state until the product renders the run-time year). Anything above 1
        # is the script itself breaking — a missing path, a syntax error — and
        # must fail here, or a broken checker would keep this CI green.
        run: |
          # The runner's shell is `bash -e`: a deliberate exit 1 would end the
          # step before its code is read, so -e is switched off here and every
          # outcome is decided below.
          set -uo pipefail
          set +e
          node acceptance/year-clock-test.mjs --clock 2027-01-01 | tee year-clock-2027.txt
          rc=${PIPESTATUS[0]}
          case "$rc" in
            0|1) ;;
            *) echo "::error::year-clock exited $rc (crash, bad path or syntax) — that is FAIL"; exit 1 ;;
          esac
          grep -q '渲染(2027) 含 2027' year-clock-2027.txt || { echo "::error::the rendered-year line is missing — the template lost its run-time interpolation, which is a permanent FAIL"; exit 1; }
          echo "asset-consistency rc=$rc (1 = still frozen on the asset year, known until the product renders it)"

      - name: acceptance — the trigger surface is one key, parsed as YAML
        run: |
          set -euo pipefail
          # Ubuntu runners are externally-managed: `pip install --user` is refused
          # there, so the fallback builds a throw-away venv instead.
          if ! python3 -c 'import yaml' 2>/dev/null; then
            python3 -m venv "$RUNNER_TEMP/venv"
            "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml
            export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          fi
          python3 acceptance/verify-trigger-surface.py .github/workflows

      - name: acceptance — 13 rendered descriptions match the pinned sources
        run: node acceptance/verify-rendered.mjs

      - name: acceptance — the gate rejects the three synthetic cases
        run: bash acceptance/fixtures/run-fixtures.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extraction
          path: |
            extraction.txt
            newline-policy.txt
            gateway-contract.txt
            live-artifact.txt
            rehearsal.txt
            archive-script.txt
            year-clock-today.txt
            year-clock-2027.txt
          retention-days: 30
